<script>
  (function () {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');

    // Пользователь мог выбрать тему вручную — тогда уважаем его выбор.
    // Иначе — берём системную.

    try { saved = localStorage.getItem('theme'); } catch (e) {}

    const theme = (saved === 'dark' || saved === 'light')

<script>
  /* ═══════════════════════════════════════════════════
     ТЕМА: системная по умолчанию + ручной выбор
     ═══════════════════════════════════════════════════ */
  const root   = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const mq     = window.matchMedia('(prefers-color-scheme: dark)');

  function getSaved() {
    try { return localStorage.getItem('theme'); } catch (e) { return null; }
  }
  function setSaved(v) {
    try {
      if (v === null) localStorage.removeItem('theme');
      else localStorage.setItem('theme', v);
    } catch (e) {}
  }
  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
  }

  // Ручное переключение темы — сохраняем выбор пользователя
  toggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    setTheme(next);
    setSaved(next);
  });

  // Реагируем на изменение системной темы В РЕАЛЬНОМ ВРЕМЕНИ,
  // но только если пользователь не выбирал тему вручную.
  function onSystemChange(e) {
    if (getSaved() === null) {
      setTheme(e.matches ? 'dark' : 'light');
    }
  }

  // Safari < 14 использует устаревший addListener
  if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
  else if (mq.addListener) mq.addListener(onSystemChange);

  // Двойной клик по иконке — «забыть» ручной выбор и вернуться к системной теме
  toggle.addEventListener('dblclick', () => {
    setSaved(null);
    setTheme(mq.matches ? 'dark' : 'light');
  });

  /* ═══════════════════════════════════════════════════
     КНОПКА с таймером 5 секунд
     ═══════════════════════════════════════════════════ */
  const btn          = document.getElementById('downloadBtn');
  const progressBar  = document.getElementById('progressBar');
  const btnContent   = document.getElementById('btnContent');
  const DOWNLOAD_URL = btn.dataset.href;

  const COUNTDOWN = 5;
  const originalHTML = btnContent.innerHTML;

  let timer = null;
  let busy  = false;

  function startDownload() {
    const a = document.createElement('a');
    a.href = DOWNLOAD_URL;
    a.download = '';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function resetButton() {
    btn.classList.remove('counting');
    btnContent.innerHTML = originalHTML;
    progressBar.style.transition = 'none';
    progressBar.style.transform  = 'scaleX(0)';
    busy = false;
    timer = null;
  }

  btn.addEventListener('click', () => {
    if (busy) return;
    busy = true;

    btn.classList.add('counting');
    btnContent.textContent = `Подготовка… ${COUNTDOWN}`;

    progressBar.style.transition = 'none';
    progressBar.style.transform  = 'scaleX(0)';
    void progressBar.offsetWidth;
    progressBar.style.transition = `transform ${COUNTDOWN}s linear`;
    progressBar.style.transform  = 'scaleX(1)';

    let left = COUNTDOWN;
    timer = setInterval(() => {
      left -= 1;
      if (left > 0) {
        btnContent.textContent = `Подготовка… ${left}`;
      } else {
        clearInterval(timer);
        timer = null;
        btnContent.textContent = 'Начинаем…';
        startDownload();
        setTimeout(resetButton, 1200);
      }
    }, 1000);
  });
</script>
